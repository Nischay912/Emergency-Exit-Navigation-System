<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Portal - Emergency Exit System</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }
    .login-card {
      background-color: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 380px;
      text-align: center;
      border-top: 4px solid #ef4444;
      animation: fadeIn 0.5s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .shield-icon {
      font-size: 54px;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }
    h2 {
      margin-top: 0;
      color: #f8fafc;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 25px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: bold;
    }
    .input-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      transition: all 0.2s;
      letter-spacing: 2px;
    }
    .input-group input:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }
    .btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn:hover {
      background-color: #dc2626;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .error {
      color: #fca5a5;
      background: #7f1d1d;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      border-left: 4px solid #ef4444;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="shield-icon">&#128274;</div>
    <h2>Security Portal</h2>
    <p class="subtitle">Emergency Exit & Crowd Control System</p>
    
    {% if error %}
    <div class="error">&#9888; {{ error }}</div>
    {% endif %}
    
    <form method="POST" action="/login">
      <div class="input-group">
        <label for="password">Administrator Password</label>
        <input type="password" id="password" name="password" required autofocus placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Authenticate</button>
    </form>
  </div>
</body>
</html>
